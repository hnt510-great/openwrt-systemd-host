# Standalone configuration for lan-apk-feeds.service, not /etc/nginx/nginx.conf.
# systemd supplies the unprivileged user and writable runtime directory.
daemon off;
worker_processes auto;
pid /run/lan-apk-feeds/nginx.pid;
error_log stderr warn;

events {
	worker_connections 1024;
}

http {
	access_log syslog:server=unix:/run/systemd/journal/dev-log,tag=lan_apk_feeds combined;
	server_tokens off;
	default_type application/octet-stream;
	sendfile on;
	tcp_nopush on;
	keepalive_timeout 30;
	client_max_body_size 1k;
	client_body_temp_path /run/lan-apk-feeds/client-body;
	proxy_temp_path /run/lan-apk-feeds/proxy;
	fastcgi_temp_path /run/lan-apk-feeds/fastcgi;
	uwsgi_temp_path /run/lan-apk-feeds/uwsgi;
	scgi_temp_path /run/lan-apk-feeds/scgi;

	server {
		listen 192.0.2.165:8088 default_server;
		server_name apk.example.invalid;
		root /srv/openwrt-feeds/public;
		autoindex off;
		allow 192.0.2.0/24;
		deny all;
		add_header Cache-Control no-cache always;
		add_header X-Content-Type-Options nosniff always;

		# ABI and kernel aliases must follow the publisher's snapshot symlinks.
		# Do not cache open descriptors across an atomic publication switch.
		open_file_cache off;
		location ~ (^|/)\. {
			return 403;
		}
		location ~ /(?:[^/]+\.apk|packages\.adb|manifest\.json|repositories\.list)$ {
			limit_except GET HEAD {
				deny all;
			}
			try_files $uri =404;
		}
		location / {
			return 403;
		}
	}
}
