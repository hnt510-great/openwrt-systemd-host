@SERIAL_CONFIG@
@TERMINAL_CONFIG@
set default=0
set timeout=@TIMEOUT@
menuentry "Install OpenWrt" {
 linux /boot/vmlinuz @INSTALLER_ROOT@ rootfstype=squashfs rootwait openwrt.init=systemd systemd.unit=openwrt-installer.target fstools_overlay=tmpfs openwrt.installer=1 @CMDLINE@
 initrd /boot/installer-initramfs.gz
}
menuentry "Install OpenWrt (serial console)" {
 linux /boot/vmlinuz @INSTALLER_ROOT@ rootfstype=squashfs rootwait openwrt.init=systemd systemd.unit=openwrt-installer-serial.target fstools_overlay=tmpfs openwrt.installer=1 @CMDLINE@
 initrd /boot/installer-initramfs.gz
}
