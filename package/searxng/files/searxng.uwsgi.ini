[uwsgi]
# Python settings
plugin = python
python-path = /usr/lib/python@PYTHON3_VERSION@/site-packages/searx
module = webapp
callable = app

# Server settings
http-socket = 0.0.0.0:8080

# Performance
master = true
processes = 2
threads = 4

# Permissions
uid = nobody
gid = nogroup

# Logging
logto = /var/log/searxng.log
# Ensure we don't log too much on flash
log-maxsize = 1048576
