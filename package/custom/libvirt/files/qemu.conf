# OpenWrt owns device events, networking and firewall configuration.
user = "libvirt-qemu"
group = "libvirt-qemu"
security_driver = "none"
dynamic_ownership = 1
remember_owner = 0
lock_manager = "lockd"
# The native OpenWrt variant has no udev or systemd-machined.
# Retain DAC and cgroup isolation; do not depend on a private /dev namespace.
namespaces = []

# Local virt-manager console traffic stays on loopback.
vnc_listen = "127.0.0.1"
spice_listen = "127.0.0.1"
