# OpenWrt owns networking and firewall configuration; guests attach to
# existing OpenWrt bridges. libvirt manages host devices it is given.
user = "libvirt-qemu"
group = "libvirt-qemu"
security_driver = "none"
dynamic_ownership = 1
remember_owner = 0
lock_manager = "lockd"
# Retain DAC and cgroup isolation; do not depend on a private /dev namespace.
namespaces = []

# Local virt-manager console traffic stays on loopback.
vnc_listen = "127.0.0.1"
spice_listen = "127.0.0.1"

# Emulated TPM (swtpm) runs under its own locked service account.
swtpm_user = "swtpm"
swtpm_group = "swtpm"
