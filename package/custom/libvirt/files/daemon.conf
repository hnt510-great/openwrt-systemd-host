[Unit]
Requires=var-lib-libvirt.mount
After=var-lib-libvirt.mount openwrt-services.service

[Service]
# Avoid automatic idle shutdown, and keep the packaged paths deterministic.
EnvironmentFile=
Environment=VIRTQEMUD_ARGS=
Environment=VIRTSTORAGED_ARGS=
Environment=VIRTSECRETD_ARGS=
Environment=VIRTLOGD_ARGS=
Environment=VIRTLOCKD_ARGS=
