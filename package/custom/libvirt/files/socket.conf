[Unit]
# Router services start after basic.target. These sockets must therefore
# not pull them back into the earlier sockets.target boot transaction.
DefaultDependencies=no
Conflicts=shutdown.target
Before=shutdown.target
Requires=var-lib-libvirt.mount
After=var-lib-libvirt.mount openwrt-services.service

[Socket]
SocketMode=0600
SocketUser=root
SocketGroup=root
